- id: '1697294184651'
  alias: Growatt_Battery_Charge_Automatic
  description: Set Charging Times Automatically
  triggers: []
  actions:
  - data_template:
      entity_id: select.growatts_battery_first_time_1_begin
      option: '{{ states(''input_text.lowest_three_hour_start_hour'') }}'
    action: select.select_option
  - data_template:
      entity_id: select.growatts_battery_first_time_1_end
      option: '{{ (as_timestamp(strptime(states(''input_text.lowest_three_hour_start_hour''),
        ''%H:%M'')) + 3*3600) | timestamp_custom(''%H:%M'', true) }}'
    action: select.select_option
  - device_id: f1e6df40352ef48a7e4e8d41e89d9767
    domain: select
    entity_id: faa4d15872cf34ffd982953abe2142fe
    type: select_last
  - device_id: f1e6df40352ef48a7e4e8d41e89d9767
    domain: select
    entity_id: 1107bcf334c808756c76501cb2d45775
    type: select_last
  - data_template:
      entity_id: input_datetime.growatt_start_time
      time: '{{ states(''input_text.lowest_three_hour_start_hour'') }}'
    action: input_datetime.set_datetime
  - data_template:
      entity_id: input_datetime.growatt_end_time
      time: '{{ (as_timestamp(strptime(states(''input_text.lowest_three_hour_start_hour''),
        ''%H:%M'')) + 3*3600) | timestamp_custom(''%H:%M'', true) }}'
    action: input_datetime.set_datetime
