  trusted_proxies:
    - 192.168.10.200
    - 192.168.10.201
    - 85.191.28.127
    - 172.0.0.0/8
    - 172.30.33.0/24

frontend:
  themes: !include_dir_merge_named themes
  extra_module_url:
    - /hacsfiles/lovelace-card-mod/card-mod.js

tts:
  - platform: google_translate
    language: "da"

var:
  kattemis_udeinde:
    friendly_name: "kattemis ude inde"
    initial_value: 0
    icon: mdi:cat

group: !include groups.yaml
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
sensor: !include sensors.yaml
mqtt: !include mqtt.yaml

shell_command:
  curl: "curl -X POST -d '{{ data }}' {{ url }}"

template:
  - sensor:
      - name: "Today Min Price"
        state: "{{ state_attr('sensor.energi_data_service', 'today_min')['price'] }}"
      - name: "Today Max Price"
        state: "{{ state_attr('sensor.energi_data_service', 'today_max')['price'] }}"
      - name: "Today Mean Price"
        state: "{{ states('sensor.energi_data_service.attributes.today_mean') }}"
      - name: "Tomorrow Min Price"
        state: "{{ state_attr('sensor.energi_data_service', 'tomorrow_min')['price'] }}"
      - name: "Tomorrow Max Price"
        state: "{{ state_attr('sensor.energi_data_service', 'tomorrow_max')['price'] }}"
      - name: "Lowest Three Hour Sum"
        state: "{{ states('input_number.lowest_three_hour_sum') }}"
        attributes:
          start_hour: "{{ states('input_text.lowest_three_hour_start_hour') }}"
  - !include template_sensors.yaml
  - !include template_solar_savings.yaml

