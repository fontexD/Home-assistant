      {% set exp_last = (this.attributes.get('last_export_kwh') if this is defined else exp_now) | float(exp_now) %}
      {% set prod_delta_raw = prod_now - prod_last %}
      {% set exp_delta_raw = exp_now - exp_last %}
      {% if prod_delta_raw < 0 %}
        {% set prod_delta = prod_now if source_day_changed else 0 %}
      {% else %}
        {% set prod_delta = prod_delta_raw %}
      {% endif %}
      {% if exp_delta_raw < 0 %}
        {% set exp_delta = exp_now if source_day_changed else 0 %}
      {% else %}
        {% set exp_delta = exp_delta_raw %}
      {% endif %}
      {% set self_delta = prod_delta - exp_delta %}
