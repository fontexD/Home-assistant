                show_points: true
                show_state: true
                show_indicator: true
                y_axis: secondary
            hour24: true
            hours_to_show: 12
            line_width: 3
            lower_bound_secondary: 0
            name: Batterier
            points_per_hour: 100
            show:
              extrema: false
              labels: false
              labels_secondary: false
              smoothing: false
            type: custom:mini-graph-card
      - show_name: true
        show_icon: true
        type: custom:button-card
