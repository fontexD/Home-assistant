sensor:
  - name: "Lights on 1st floor"
    unique_id: lights_1st_floor
    default_entity_id: sensor.lights_1st_floor
    state: >
      {%- set search_state = 'on' %}
      {%- set search_areas = ['Soveværelse', 'Badeværelse', 'Stue', 'Køkken', 'trappe', 'Entre', 'Jessie værelse'] %}
      {%- set ns = namespace(lights=[]) %}
      {%- for light in states.light | selectattr('state','eq', search_state) %}
        {%- for area in search_areas %}
          {% if area_name(light.entity_id) == area and "1st Floor" not in state_attr(light.entity_id, "friendly_name") %}
            {%- set ns.lights = ns.lights + [ light.entity_id ] %}
          {% endif%}
        {%- endfor %}
      {%- endfor %}
      {{ ns.lights | list | length }}

  - name: "Solar Panel price"
    unique_id: solar_panel_price
    default_entity_id: sensor.solar_panel_price
    state: "35000"
    unit_of_measurement: "KR"

  - name: "Solar Panel savings"
    unique_id: solar_savings
    default_entity_id: sensor.solar_savings
    state: "{{ ((states('sensor.energy_consumed_luxembourg') | float) - 145) * state_attr('sensor.nordpool_kwh_dk1_dkk_3_10_025', 'average') }}"
    unit_of_measurement: "KWH"

  - name: "Solar Panel left"
    unique_id: solar_panel_left
    default_entity_id: sensor.solar_panel_left
    state: "{{ (states('sensor.solar_panel_price') | float - (states('sensor.solar_savings')) | float ) }}"
    unit_of_measurement: "KR"

  - name: "self_consumption"
    unique_id: self_consumption
    default_entity_id: sensor.self_consumption
    state: "{{ ((states('sensor.growatts_today_s_solar_energy') | float)) + ((states('sensor.growatts_today_s_battery_output_energy') | float)) - ((states('sensor.growatts_today_s_battery_input_energy') | float)) - ((states('sensor.growatts_today_s_grid_export') | float)) }}"
    unit_of_measurement: "KWH"

  - name: "Power Consumption (daily)"
    unique_id: power_consumption_daily
    default_entity_id: sensor.power_consumption_daily
    state: >
      {% set consumption = ((states('sensor.self_consumption') | float)) %}
      {% set price = state_attr('sensor.nordpool_kwh_dk1_dkk_2_035_025', 'average') %}
      {% set cost = consumption * price %}
      {{ cost }}
    unit_of_measurement: "Kr"

  - name: "Restaffald Collection"
    unique_id: restaffald_collection
    default_entity_id: sensor.restaffald_collection
    state: "{{ states('sensor.restaffald_collection') }}"
    device_class: timestamp

  - name: "Glas, Metal, Hård Plast Collection"
    unique_id: glas_metal_hard_plast_collection
    default_entity_id: sensor.glas_metal_hard_plast_collection
    state: "{{ states('sensor.glas_metal_hard_plast_collection') }}"
    device_class: timestamp

  - name: "Pap, Papir Collection"
    unique_id: pap_papir_collection
    default_entity_id: sensor.pap_papir_collection
    state: "{{ states('sensor.pap_papir_collection') }}"
    device_class: timestamp

  - name: "Hourly Solar Production"
    unique_id: hourly_solar_production
    default_entity_id: sensor.hourly_solar_production
    state: "{{ states('sensor.growatts_today_s_solar_energy') }}"
    attributes:
      00_01: "{{ state_attr('sensor.hourly_solar_production_00_01', 'value') }}"
      01_02: "{{ state_attr('sensor.hourly_solar_production_01_02', 'value') }}"
      02_03: "{{ state_attr('sensor.hourly_solar_production_02_03', 'value') }}"
      03_04: "{{ state_attr('sensor.hourly_solar_production_03_04', 'value') }}"
      04_05: "{{ state_attr('sensor.hourly_solar_production_04_05', 'value') }}"
      05_06: "{{ state_attr('sensor.hourly_solar_production_05_06', 'value') }}"
      06_07: "{{ state_attr('sensor.hourly_solar_production_06_07', 'value') }}"
      07_08: "{{ state_attr('sensor.hourly_solar_production_07_08', 'value') }}"
      08_09: "{{ state_attr('sensor.hourly_solar_production_08_09', 'value') }}"
      09_10: "{{ state_attr('sensor.hourly_solar_production_09_10', 'value') }}"
      10_11: "{{ state_attr('sensor.hourly_solar_production_10_11', 'value') }}"
      11_12: "{{ state_attr('sensor.hourly_solar_production_11_12', 'value') }}"
      12_13: "{{ state_attr('sensor.hourly_solar_production_12_13', 'value') }}"
      13_14: "{{ state_attr('sensor.hourly_solar_production_13_14', 'value') }}"
      14_15: "{{ state_attr('sensor.hourly_solar_production_14_15', 'value') }}"
      15_16: "{{ state_attr('sensor.hourly_solar_production_15_16', 'value') }}"
      16_17: "{{ state_attr('sensor.hourly_solar_production_16_17', 'value') }}"
      17_18: "{{ state_attr('sensor.hourly_solar_production_17_18', 'value') }}"
      18_19: "{{ state_attr('sensor.hourly_solar_production_18_19', 'value') }}"
      19_20: "{{ state_attr('sensor.hourly_solar_production_19_20', 'value') }}"
      20_21: "{{ state_attr('sensor.hourly_solar_production_20_21', 'value') }}"
      21_22: "{{ state_attr('sensor.hourly_solar_production_21_22', 'value') }}"
      22_23: "{{ state_attr('sensor.hourly_solar_production_22_23', 'value') }}"
      23_00: "{{ state_attr('sensor.hourly_solar_production_23_00', 'value') }}"

  - name: "Net Power Consumption"
    unique_id: net_power_consumption
    default_entity_id: sensor.net_power_consumption
    state: "{{ states('sensor.power_consumed') | float - states('sensor.growatts_ac_power_to_grid_total') | float }}"
    unit_of_measurement: "W"

  - name: "is_restaffald_collection_tomorrow"
    unique_id: is_restaffald_collection_tomorrow
    default_entity_id: sensor.is_restaffald_collection_tomorrow
    state: "{{ (as_datetime(states('sensor.restaffald_collection_2')) - timedelta(days=1)).strftime('%Y-%m-%d') == now().strftime('%Y-%m-%d') }}"

  - name: "is_pap_papir_collection_tomorrow"
    unique_id: is_pap_papir_collection_tomorrow
    default_entity_id: sensor.is_pap_papir_collection_tomorrow
    state: "{{ (as_datetime(states('sensor.pap_papir_collection_2')) - timedelta(days=1)).strftime('%Y-%m-%d') == now().strftime('%Y-%m-%d') }}"

  - name: "is_glas_metal_hard_plast_collection_tomorrow"
    unique_id: is_glas_metal_hard_plast_collection_tomorrow
    default_entity_id: sensor.is_glas_metal_hard_plast_collection_tomorrow
    state: "{{ (as_datetime(states('sensor.glas_metal_hard_plast_collection_2')) - timedelta(days=1)).strftime('%Y-%m-%d') == now().strftime('%Y-%m-%d') }}"

  - name: "Danfoss Current Power"
    unique_id: danfoss_current_power
    default_entity_id: sensor.danfoss_current_power
    state: >
      {% set v1 = state_attr('sensor.danfoss_session_data', 'current_kw') %}
      {% set v2 = state_attr('sensor.danfoss_session_data_2', 'current_kw') %}
      {{ (v1 if is_number(v1) else v2) | float(none) }}
    availability: >
      {% set v1 = state_attr('sensor.danfoss_session_data', 'current_kw') %}
      {% set v2 = state_attr('sensor.danfoss_session_data_2', 'current_kw') %}
      {{ is_number(v1) or is_number(v2) }}
    unit_of_measurement: "kW"
    device_class: power
    state_class: measurement

  - name: "Danfoss Production Today"
    unique_id: danfoss_production_today
    default_entity_id: sensor.danfoss_production_today
    state: >
      {% set v1 = state_attr('sensor.danfoss_session_data', 'today_kwh') %}
      {% set v2 = state_attr('sensor.danfoss_session_data_2', 'today_kwh') %}
      {{ (v1 if is_number(v1) else v2) | float(none) }}
    availability: >
      {% set v1 = state_attr('sensor.danfoss_session_data', 'today_kwh') %}
      {% set v2 = state_attr('sensor.danfoss_session_data_2', 'today_kwh') %}
      {{ is_number(v1) or is_number(v2) }}
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing

  - name: "Danfoss Current Power Watt"
    unique_id: danfoss_current_power_watt
    default_entity_id: sensor.danfoss_current_power_watt
    state: >
      {% if is_number(states('sensor.danfoss_current_power')) %}
        {{ (states('sensor.danfoss_current_power') | float * 1000) | round(0) }}
      {% else %}
        {{ none }}
      {% endif %}
    availability: "{{ is_number(states('sensor.danfoss_current_power')) }}"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement

  - name: "Danfoss Scrape Status"
    unique_id: danfoss_scrape_status
    default_entity_id: sensor.danfoss_scrape_status
    state: >
      {% set p = states('sensor.danfoss_current_power') %}
      {% set e = states('sensor.danfoss_production_today') %}
      {% if p in ['unknown','unavailable','none','None',''] or e in ['unknown','unavailable','none','None',''] %}
        session_expired
      {% else %}
        online
      {% endif %}

  - name: "Danfoss Session Expired"
    unique_id: danfoss_session_expired
    default_entity_id: sensor.danfoss_session_expired
    state: >
      {% if states('sensor.danfoss_scrape_status') == 'session_expired' %}
        on
      {% else %}
        off
      {% endif %}

  - name: "Solar Combined Power Now"
    unique_id: solar_combined_power_now
    default_entity_id: sensor.solar_combined_power_now
    state: >
      {{
        (
          (states('sensor.growatts_pv_power_total') | float(0) / 1000)
          + (states('sensor.danfoss_current_power') | float(0))
        ) | round(3)
      }}
    unit_of_measurement: "kW"
    device_class: power
    state_class: measurement

  - name: "Solar Combined Production Today"
    unique_id: solar_combined_production_today
    default_entity_id: sensor.solar_combined_production_today
    state: >
      {{
        (
          (states('sensor.growatts_today_s_solar_energy_2') | float(0))
          + (states('sensor.danfoss_production_today') | float(0))
        ) | round(3)
      }}
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing

  - name: "Battery Combined Charge Power"
    unique_id: battery_combined_charge_power
    default_entity_id: sensor.battery_combined_charge_power
    state: >
      {{
        (
          (states('sensor.growatts_battery_charge_power') | float(0))
          + (states('sensor.skur_battery_charge_power') | float(0))
        ) | round(1)
      }}
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement

  - name: "Battery Combined Discharge Power"
    unique_id: battery_combined_discharge_power
    default_entity_id: sensor.battery_combined_discharge_power
    state: >
      {{
        (
          (states('sensor.growatts_battery_discharge_power') | float(0))
          + (states('sensor.skur_battery_discharge_power') | float(0))
        ) | round(1)
      }}
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement

  - name: "Solar Total Savings Today"
    unique_id: solar_total_savings_today
    default_entity_id: sensor.solar_total_savings_today
    state: >
      {{
        (
          (states('sensor.solar_export_value_today') | float(0))
          + (states('sensor.solar_self_consumption_value_today') | float(0))
        ) | round(4)
      }}
    unit_of_measurement: "kr"

  - name: "Solar Total Savings Current Month"
    unique_id: solar_total_savings_current_month
    default_entity_id: sensor.solar_total_savings_current_month
    state: >
      {{
        (
          (states('sensor.solar_export_value_current_month') | float(0))
          + (states('sensor.solar_self_consumption_value_current_month') | float(0))
        ) | round(4)
      }}
    unit_of_measurement: "kr"

  - name: "Solar Total Savings Total Ever"
    unique_id: solar_total_savings_total_ever
    default_entity_id: sensor.solar_total_savings_total_ever
    state: >
      {{
        (
          (states('sensor.solar_export_value_total_ever') | float(0))
          + (states('sensor.solar_self_consumption_value_total_ever') | float(0))
        ) | round(4)
      }}
    unit_of_measurement: "kr"
