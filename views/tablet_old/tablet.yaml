            show_state: true
            show_indicator: true
            y_axis: secondary
          - color: Green
            entity: sensor.growatts_today_s_grid_export
            name: Export
            show_points: true
            show_state: true
            show_indicator: true
            y_axis: secondary
        hour24: true
        hours_to_show: 12
        line_width: 3
        lower_bound_secondary: 0
        name: Import/Export
        points_per_hour: 100
        show:
          extrema: false
          labels: false
          labels_secondary: false
          smoothing: false
        type: custom:mini-graph-card
      - initial_view: dayGridMonth
