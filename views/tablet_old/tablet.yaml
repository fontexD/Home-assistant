kiosk_mode:
  entity_settings:
    - entity:
        input_boolean.fullscreen_mode_pc: 'on'
      hide_sidebar: false
      hide_header: false
sidebar:
  hideTopMenu: false
  hideHassSidebar: false
  width:
    desktop: 25
    mobile: 25
    tablet: 25
  digitalClock: false
  digitalClockWithSeconds: false
  clock: false
  date: false
  dateFormat: dddd, DD. MMMM YYYY
  sidebarMenu:
    - action: navigate
      navigation_path: /dashboard-tablet/tablet-hjem
      name: Hjem
      active: true
      icon: mdi:mushroom-off
    - action: navigate
      navigation_path: /dashboard-tablet/tablet-varelse
      name: Værelse
      active: true
      icon: mdi:bed
    - action: navigate
      navigation_path: /dashboard-tablet/tablet-stue
      name: Stue
      active: true
      icon: mdi:sofa
    - action: navigate
      navigation_path: /dashboard-tablet/tablet-sovevarelse
      name: Soveværelse
      active: true
      icon: mdi:bed-king-outline
    - action: navigate
      navigation_path: /dashboard-tablet/tablet-tkokken
      name: Køkken
      active: true
      icon: mdi:fridge-outline
    - action: navigate
      navigation_path: /dashboard-tablet/tablet-strom
      name: Strøm
      active: true
      icon: mdi:flash
    - action: navigate
      navigation_path: /dashboard-tablet/tablet-bil
      name: Bil
      active: true
      icon: mdi:car
    - action: navigate
      navigation_path: /dashboard-tablet/tablet-el
      name: El
      active: true
      icon: mdi:power-plug
    - action: navigate
      navigation_path: /dashboard-tablet/tablet-batteri
      name: Batteri
      active: true
      icon: mdi:battery-outline
    - action: navigate
      navigation_path: /dashboard-tablet/tablet-kamera
      name: Kamera
      active: true
      icon: mdi:camera
    - action: navigate
      navigation_path: /dashboard-tablet/tablet-solceller
      name: Solceller
      active: true
      icon: mdi:solar-panel
    - action: navigate
      navigation_path: /dashboard-tablet/tablet-Støvsuger
      name: Støvsuger
      active: true
      icon: mdi:robot-vacuum
    - action: navigate
      navigation_path: /dashboard-tablet/tablet-eloverblik
      name: Eloverblik
      active: true
      icon: mdi:chart-line
    - action: navigate
      navigation_path: /dashboard-tablet/tablet-gang
      name: Gang
      active: true
      icon: mdi:stairs
  template: |
    <li id="greeting">
      {% if now().hour < 5 %} God nat {{'\U0001F634'}}
      {% elif now().hour < 9 %} God morgen {{'\u2615\uFE0F'}}
      {% elif now().hour < 18 %} God dag {{'\U0001F44B\U0001F3FB'}}
      {% else %} God aften {{'\U0001F44B\U0001F3FB'}}{% endif %}
    </li>
    <div class="status">
      {% if states('sensor.zahler_lights_gesamt') | float == 0 %}
        <li class="lights-off">Der er ingen lamper tændt!</li>
      {% elif states('sensor.zahler_lights_gesamt') | float == 1 %}
        <li class="one-light">Der er én lampe tændt!</li>
      {% else %}
        <li class="multiple-lights">Der er {{states('sensor.zahler_lights_gesamt')}} lamper tændt!</li>
      {% endif %}

      {% if states('sensor.zahler_schalter_gesamt') | float == 0 %}
        <li class="switches-off">Der er ingen kontakter tændt!</li>
      {% elif states('sensor.zahler_schalter_gesamt') | float == 1 %}
        <li class="one-switch">Der er én kontakt tændt!</li>
      {% else %}
        <li class="multiple-switches">Der er {{states('sensor.zahler_schalter_gesamt')}} kontakter tændt!</li>
      {% endif %}
    </div>
  bottomCard:
    type: horizontal-stack
    cardOptions:
      cards:
        - type: custom:mushroom-person-card
          entity: person.helle
          icon_type: entity-picture
          primary_info: name
          name: Pio
          secondary_info: state
        - type: custom:mushroom-person-card
          entity: person.peter
          icon_type: entity-picture
          primary_info: name
          name: Pao
          secondary_info: state
  topCard:
    type: custom:vertical-stack-in-card
    card_mod:
      style: |
        ha-card {
          border: none;
          background: transparent;
        }
    cardOptions:
      cards:
        - type: custom:clock-weather-card
          entity: weather.forecast_brabrand
          forecast_rows: 2
          hide_clock: true
          hide_date: true
          card_mod:
            style: |
              ha-card {
                background: transparent;
              }
        - type: custom:button-card
          entity: input_boolean.fullscreen_mode_pc
          show_state: false
          show_icon: true
          icon: mdi:arrow-expand
          layout: icon_name
          name: Fuldskærm
          size: 15%
          styles:
            card:
              - background: transparent
    cardStyle: |
      :host {
        width: 100%;
      }
      ha-card {
        border: none;
        background: transparent;
      }
  style: |
    :host {
        --sidebar-background: var(--primary-background-color);
        --sidebar-text-color: var(--primary-text-color);
        --border-radius: 5px;
        --face-color: var(--primary-text-color);
        --face-border-color: var(--primary-text-color);
        --clock-hands-color: var(--primary-background-color);
        --clock-seconds-hand-color: var(--primary-color);
        --clock-middle-background: var(--primary-text-color);
        --clock-middle-border: var(--primary-background-color);
        box-shadow: inset -19px -1px 5px -14px var(--divider-color);
        border-radius: 15px 0px 0px 15px;
    }
    #customSidebar {
        z-index: 9999!important;
    }
    .sidebarMenu li {
        line-height: 35px!important;
        color: var(--primary-text-color)!important;
    }
    .bottom {
        width: 100% !important;
    }
    .sidebarMenu li.active {
        background-color: var(--primary-color)!important;
        border-radius: 0px !important;
        color: var(--primary-text-color) !important;
        font-weight: bold !important;
    }
    .sidebarMenu li.active ha-icon {
        color: var(--primary-text-color) !important;
    }
    .clock {
        width: 60% !important;
        padding-top: 60% !important;
        margin: -10px 50px 10px 50px !important;
    }
    .digitalClock {
        padding-bottom: 5px;
        padding-top: 15px;
        color: var(--primary-text-color) !important;
        opacity: 0.6;
        font-size: 60px !important;
        font-weight: 500 !important;
        font-family: Arial Rounded MT;
        letter-spacing: -0.05vw !important;
        text-align: center;
    }
    .date {
        padding-bottom: 10px;
        padding-top: 10px;
        color: var(--primary-text-color);
        opacity: 0.6;
        font-size: 25px;
        font-weight: 300;
        text-align: center;
        letter-spacing: -0.05vw;
    }
    .template li {
        color: var(--primary-text-color) !important;
        font-size: 1.1vw !important;
        font-weight: 200 !important;
        opacity: 0.6;
        letter-spacing: -0.05vw !important;
        text-align: center;
        margin-bottom: 10px !important;
    }
    .template li.one-light {
        color: orange !important;
        font-weight: bold !important;
    }
    .template li.multiple-lights {
        color: red !important;
        font-weight: bold !important;
    }
    .template li.one-switch {
        color: orange !important;
        font-weight: bold !important;
    }
    .template li.multiple-switches {
        color: red !important;
        font-weight: bold !important;
    }
    .status {
        padding: 10px;
        background-color: var(--sidebar-background);
        border-radius: var(--border-radius);
        text-align: center;
    }
swipe_nav:
  wrap: true
  enable_mouse_swipe: true
  animate: fade
  animate_duration: 300
  prevent_default: false
  swipe_amount: 10
views:
  - theme: Backend-selected
    title: Hjem
    badges: []
    cards:
      - type: vertical-stack
