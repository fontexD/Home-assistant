  - theme: Backend-selected
    title: solceller
    path: tablet-solceller
    icon: mdi:solar-panel
    cards:
      - type: vertical-stack
        cards:
          - type: markdown
            content: ' '
            title: Import/Export
          - decimals: 1
            icon: mdi:power-plug-outline
            entities:
              - color: Red
                entity: sensor.growatts_today_s_grid_import
                name: Import
                show_points: true
                show_state: true
                show_indicator: true
                y_axis: secondary
              - color: Green
                entity: sensor.growatts_today_s_grid_export
                name: Export
                show_points: true
                show_state: true
                show_indicator: true
                y_axis: secondary
            hour24: true
            hours_to_show: 12
            line_width: 3
            lower_bound_secondary: 0
            name: Import/Export
            points_per_hour: 100
            show:
              extrema: false
              labels: false
              labels_secondary: false
              smoothing: false
            type: custom:mini-graph-card
      - type: vertical-stack
        cards:
          - type: markdown
            content: ' '
            title: Produktion
          - decimals: 1
            icon: mdi:solar-panel-large
            entities:
              - color: red
                entity: sensor.solceller_total_aktuel
                name: Hus Growatt
                show_points: false
                show_state: false
                show_graph: false
                show_indicator: false
              - color: red
                entity: sensor.growatts_pv_power_total_kw
                name: Hus Growatt
                show_points: true
                show_state: true
                show_indicator: true
              - color: blue
                entity: sensor.skur_pv_power_total_kw
                name: Skur Growatt
                show_points: true
                show_state: true
                show_indicator: true
              - color: green
                entity: sensor.delta_produktion_aktuel
                name: Hus Delta
                show_points: true
                show_state: true
                show_indicator: true
                y_axis: secondary
            hour24: true
            hours_to_show: 16
            line_width: 3
            lower_bound_secondary: 0
            name: Solceller Produktion Aktuel
            points_per_hour: 1
            show:
              extrema: false
              labels: false
              labels_secondary: false
              smoothing: false
            type: custom:mini-graph-card
          - decimals: 1
            icon: mdi:solar-panel-large
            entities:
              - color: '#00ff00'
                entity: sensor.solceller_total
                name: Total
                show_points: false
                show_state: false
                show_graph: false
                show_indicator: true
              - color: red
                entity: sensor.growatts_today_s_solar_energy
                name: Hus Growatt
                show_points: true
                show_state: true
                show_indicator: true
              - color: blue
                entity: sensor.skur_today_s_solar_energy
                name: Skur Growatt
                show_points: true
                show_state: true
                show_indicator: true
              - color: green
                entity: sensor.delta_daglig
                name: Hus Delta
                show_points: true
                show_state: true
                show_indicator: true
                y_axis: secondary
            hour24: true
            hours_to_show: 12
            line_width: 3
            lower_bound_secondary: 0
            name: Solceller Produktion 24 Timer
            points_per_hour: 1
            show:
              extrema: true
              labels: false
              labels_secondary: false
              smoothing: false
            type: custom:mini-graph-card
      - type: vertical-stack
        cards:
          - type: markdown
            content: |-

              {% if states.sensor.growatts_battery_charge_power %}
                {% set sensor = states('sensor.growatts_battery_charge_power')|float(0.0) %}
                {% set sensor1 = states('sensor.growatts_battery_discharge_power')|default('Unknown') %}
                {% if sensor == 0.0 %}
                  Hus Aflader {{ sensor1 }} Kw
                {% elif sensor != 0.0 %}
                  Hus lader {{ sensor }} Kw
                {% endif %}
                  {% endif %}
            title: Batteri
          - type: vertical-stack
            cards:
              - decimals: 1
                icon: mdi:battery
                entities:
                  - color: blue
                    entity: sensor.skur_battery_soc
                    name: Skur
                    show_points: true
                    show_state: true
                    show_indicator: true
                  - color: red
                    entity: sensor.growatts_battery_soc
                    name: Hus
                    show_points: true
                    show_state: true
                    show_indicator: true
                    y_axis: secondary
                hour24: true
                hours_to_show: 12
                line_width: 3
                lower_bound_secondary: 0
                name: Batterier
                points_per_hour: 1
                show:
                  extrema: false
                  labels: false
                  labels_secondary: false
                  smoothing: false
                type: custom:mini-graph-card
          - type: entities
            entities:
              - entity: input_datetime.growatt_start_time
              - entity: input_datetime.growatt_end_time
              - entity: input_boolean.start_growatt_charge
            title: Opladning Hus
          - type: custom:mushroom-template-card
            primary: Oplad batteri når billigst (3 timer)
            secondary: |2
                Kl. {{ states('input_text.lowest_three_hour_start_hour') }} Prisen vil være  {{ states('input_number.lowest_three_hour_sum') }} Kr
            icon: mdi:battery-positive
            tap_action:
              action: call-service
              service: automation.trigger
              target:
                entity_id: automation.Growatt_Battery_Charge_Automatic
              data:
                skip_condition: true
            icon_color: green
