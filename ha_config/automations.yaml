- id: '1684566929169'
  alias: Growatt_Battery_Charge_manual
  description: ''
  triggers:
  - entity_id: input_boolean.start_growatt_charge
    to: 'on'
    trigger: state
  actions:
  - data_template:
      entity_id: select.growatts_battery_first_time_1_begin
      option: '{{ states(''input_datetime.growatt_start_time'') | regex_replace('':[0-9]{2}$'',
        '''') }}'
    enabled: true
    action: select.select_option
  - data_template:
      entity_id: select.growatts_battery_first_time_1_end
      option: '{{ states(''input_datetime.growatt_end_time'') | regex_replace('':[0-9]{2}$'',
        '''') }}'
    action: select.select_option
  - device_id: f1e6df40352ef48a7e4e8d41e89d9767
    domain: select
    entity_id: faa4d15872cf34ffd982953abe2142fe
    type: select_last
  - device_id: f1e6df40352ef48a7e4e8d41e89d9767
    domain: select
    entity_id: 1107bcf334c808756c76501cb2d45775
    type: select_last
  - device_id: f1e6df40352ef48a7e4e8d41e89d9767
    domain: select
    entity_id: 44bde0caba0872245eac1aa2ab3dce79
    type: select_next
    cycle: false
    enabled: false
  - entity_id: input_boolean.start_growatt_charge
    action: input_boolean.turn_off
  mode: single
