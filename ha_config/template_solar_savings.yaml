triggers:
  - trigger: time_pattern
    minutes: "/15"
    id: tick
  - trigger: event
    event_type: solar_savings_tick
    id: tick

sensor:
  - name: "Solar Export Value Today"
    unique_id: solar_export_value_today
    default_entity_id: sensor.solar_export_value_today
    unit_of_measurement: "kr"
    state: >
      {% set today = now().strftime('%Y-%m-%d') %}
      {% set last_day = (this.attributes.get('last_calc_day') if this is defined else today) | string %}
      {% set day_changed = last_day != today %}
      {% set max_interval_kwh = 10 %}
      {% set price = states('sensor.powercost_spotprice_vat') | float(0) %}
      {% set export_now = states('sensor.growatts_today_s_grid_export_2') | float(0) %}
      {% set export_last = (this.attributes.get('last_export_kwh') if this is defined else export_now) | float(export_now) %}
      {% set export_delta = export_now - export_last %}
      {% set export_delta = 0 if export_delta < 0 else export_delta %}
      {% set export_delta = 0 if export_delta > max_interval_kwh else export_delta %}
      {% set running = (this.state if this is defined else 0) | float(0) %}
      {% set running = 0 if day_changed else running %}
      {{ (running + (export_delta * price)) | round(4) }}
    attributes:
      last_export_kwh: "{{ states('sensor.growatts_today_s_grid_export_2') | float(0) }}"
      last_calc_day: "{{ now().strftime('%Y-%m-%d') }}"
      interval_minutes: 15
      interval_export_kwh: >
        {% set max_interval_kwh = 10 %}
        {% set now_v = states('sensor.growatts_today_s_grid_export_2') | float(0) %}
        {% set last_v = (this.attributes.get('last_export_kwh') if this is defined else now_v) | float(now_v) %}
        {% set d = now_v - last_v %}
        {% set d = 0 if d < 0 else d %}
        {% set d = 0 if d > max_interval_kwh else d %}
        {{ d | round(4) }}
      price_used_kr_kwh: "{{ states('sensor.powercost_spotprice_vat') | float(0) }}"

