- id: '1716744128529'
  alias: tts_skrald
  description: Announce garbage removal details the day before pickup
  trigger:
  - platform: time
    at: '18:00:00'
  condition:
  - condition: template
    value_template: '{% set pickup_date = states(''sensor.glas_metal_hard_plast_collection_2'')
      %} {% set pickup_date_obj = strptime(pickup_date, ''%Y-%m-%d'') %} {{ (pickup_date_obj
      - now().date()).days == 1 }}

      '
  action:
  - service: tts.google_translate_say
    data:
      cache: false
      entity_id: media_player.unnamed_room
      language: da
      message: Imorgen hentes glas metal hård plast
  mode: single
- id: '1719938421840'
  alias: skralde_afhentning
  description: ''
  trigger:
  - platform: time
    at: '16:30:00'
  condition:
  - condition: template
    value_template: "{{ is_state('sensor.is_restaffald_collection_today', 'True')
      or\n    is_state('sensor.is_pap_papir_collection_today', 'True') or\n    is_state('sensor.is_glas_metal_hard_plast_collection_today',
      'True') }}\n"
  action:
  - service: light.turn_on
    data:
      color_name: blue
    target:
      entity_id: light.kokken
  mode: single
